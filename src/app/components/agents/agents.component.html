<app-navbar />

<div class="relative min-h-screen bg-[#050505] overflow-hidden pt-32 pb-20">
  <div class="mesh-gradient-bg opacity-30"></div>
  <div class="map-overlay-tech"></div>

  <div class="container mx-auto px-6 relative z-10">

    <div class="flex flex-col lg:flex-row lg:items-end justify-between mb-16 gap-8 text-white">
      <div>
        <span class="text-indigo-500 font-mono tracking-[0.5em] text-[10px] uppercase block mb-2">
          // Valorant_Protocol: Agent_Roster
        </span>
        <h1 class="text-6xl md:text-8xl font-black uppercase italic tracking-tighter leading-none">
          Agents
        </h1>
      </div>

      <nav class="flex flex-wrap gap-2">
        <button *ngFor="let role of roles" (click)="filterByRole(role)" [class.bg-indigo-600]="selectedRole === role"
          [class.border-indigo-600]="selectedRole === role"
          class="px-6 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest border border-white/10 transition-all bg-white/5 hover:bg-white/10 text-white">
          {{ role }}
        </button>
      </nav>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
      <div *ngFor="let agent of filteredAgents"
        class="group relative bg-white/[0.03] border border-white/10 rounded-[2.5rem] p-6 h-[500px] transition-all duration-500 hover:border-indigo-500/40 hover:-translate-y-3 overflow-hidden flex flex-col">

        <span
          class="absolute -bottom-4 -right-4 text-[7rem] font-black text-white/[0.02] uppercase pointer-events-none select-none italic transition-all group-hover:text-indigo-500/10">
          {{ agent.displayName }}
        </span>

        <div class="relative z-10 flex items-center gap-3 mb-2">
          <img *ngIf="agent.role?.displayIcon" [src]="agent.role.displayIcon" class="w-4 h-4 opacity-50 invert"
            alt="role">
          <span class="text-[10px] font-mono text-indigo-400 uppercase tracking-widest">{{ agent.role?.displayName ||
            'Unknown' }}</span>
        </div>

        <div class="relative flex-1 flex items-center justify-center z-10 cursor-pointer"
          [routerLink]="['/agents', agent.uuid]">
          <div
            class="absolute w-48 h-48 bg-indigo-600/10 blur-[70px] rounded-full group-hover:bg-indigo-600/20 transition-all">
          </div>

          <img [src]="agent.fullPortraitV2" [alt]="agent.displayName" loading="lazy"
            class="h-full w-full object-contain drop-shadow-[0_20px_40px_rgba(0,0,0,0.6)] group-hover:scale-110 transition-transform duration-700">
        </div>

        <div class="relative z-10 mt-auto pt-4 text-center">
          <h3
            class="text-4xl font-black text-white uppercase italic tracking-tighter leading-none mb-4 group-hover:text-indigo-400 transition-colors">
            {{ agent.displayName }}
          </h3>

          <button [routerLink]="['/agents', agent.uuid]"
            class="w-full py-3 rounded-2xl border border-white/10 text-white text-[10px] font-black uppercase tracking-widest hover:bg-white hover:text-black transition-all">
            Discover More
          </button>
        </div>

        <div
          class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity">
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer />

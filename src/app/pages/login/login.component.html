<app-navbar />

<div class="relative min-h-screen bg-[#050505] flex items-center justify-center overflow-hidden pt-20">

    <div class="absolute inset-0 z-0">
        <div class="blob blob-indigo"></div>
        <div class="blob blob-red"></div>
        <div class="map-overlay-tech opacity-30"></div>
    </div>

    <div class="relative z-10 w-full max-w-md px-6 animate-fade-in">
        <div class="bg-white/[0.03] border border-white/10 rounded-[2.5rem] p-10 backdrop-blur-3xl shadow-2xl">

            <div class="text-center mb-10">
                <span class="text-indigo-500 font-mono tracking-[0.4em] text-[10px] uppercase block mb-2">
                    // System_Auth
                </span>
                <h2 class="text-4xl font-black text-white uppercase italic tracking-tighter">Identity Check</h2>
                <p class="text-gray-500 text-[10px] font-mono uppercase tracking-widest mt-2">
                    Enter credentials to sync tracker data
                </p>
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">

                <div class="space-y-2">
                    <label class="text-[10px] font-mono text-white/40 uppercase tracking-widest ml-4">Riot ID</label>
                    <div class="relative">
                        <input type="text" formControlName="riotId" placeholder="Nickname"
                            class="w-full bg-black/40 border border-white/10 rounded-2xl px-6 py-4 text-white placeholder:text-white/10 focus:outline-none focus:border-indigo-500 transition-all font-mono text-sm">
                        <div
                            class="absolute right-4 top-1/2 -translate-y-1/2 w-1.5 h-1.5 bg-indigo-500 rounded-full animate-pulse">
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-mono text-white/40 uppercase tracking-widest ml-4">Tagline (Access
                        Code)</label>
                    <div class="relative">
                        <input type="text" formControlName="tagline" placeholder="Tagline"
                            class="w-full bg-black/40 border border-white/10 rounded-2xl px-6 py-4 text-white placeholder:text-white/10 focus:outline-none focus:border-indigo-500 transition-all font-mono text-sm">
                    </div>
                </div>

                <div *ngIf="errorMessage"
                    class="bg-red-500/10 border border-red-500/20 rounded-xl py-3 px-4 animate-bounce">
                    <p class="text-red-500 text-[10px] font-mono uppercase text-center">
                        {{ errorMessage }}
                    </p>
                </div>

                <button type="submit" [disabled]="loading || loginForm.invalid"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-30 disabled:cursor-not-allowed text-white font-black uppercase italic tracking-widest py-4 rounded-2xl shadow-[0_10px_30px_rgba(79,70,229,0.3)] transition-all transform hover:-translate-y-1 active:scale-95">

                    <div class="flex items-center justify-center gap-2">
                        <span *ngIf="!loading">Authorize Access</span>
                        <ng-container *ngIf="loading">
                            <span class="animate-pulse">Establishing Connection...</span>
                            <div class="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin">
                            </div>
                        </ng-container>
                    </div>
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-white/5 flex flex-col items-center gap-4">
                <a href="#"
                    class="text-[10px] text-gray-500 uppercase tracking-widest hover:text-white transition-colors">
                    Need help with Riot ID?
                </a>
                <p class="text-[10px] text-white/20 font-mono italic">Secure Terminal v.2.0.26</p>
            </div>
        </div>

        <div class="mt-6 flex justify-between px-6 opacity-20">
            <div class="flex flex-col gap-1">
                <div class="w-12 h-[1px] bg-white"></div>
                <div class="w-8 h-[1px] bg-white"></div>
            </div>
            <div class="font-mono text-[8px] text-white tracking-widest">ENCRYPTED_LINE_ACTIVE</div>
        </div>
    </div>
</div>

<app-footer />

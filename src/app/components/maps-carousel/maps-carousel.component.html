<section class="relative min-h-[650px] flex items-center justify-center overflow-hidden bg-black">

    <div class="absolute inset-0 z-0 transition-opacity duration-1000">
        <div class="absolute inset-0 bg-gradient-to-r from-[#050505] via-transparent to-black/20 z-10"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-[#050505] via-transparent to-black/20 z-10"></div>

        <img [src]="activeMapImage" class="w-full h-full object-cover animate-ken-burns transition-all duration-700"
            alt="Map Background">
    </div>

    <div class="container mx-auto px-6 relative z-20">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">

            <div class="order-2 lg:order-1">
                <p-carousel [value]="maps" [numVisible]="1" [numScroll]="1" [circular]="true" [autoplayInterval]="5000"
                    (onPageChange)="onMapChange($event)" class="custom-map-selector">
                    <ng-template pTemplate="item" let-map>
                        <div class="py-10 outline-none">
                            <span class="text-indigo-500 font-mono tracking-[0.5em] text-[10px] uppercase">
                                Location_Secured // Sector_{{map.name}}
                            </span>
                            <h2
                                class="text-7xl md:text-9xl font-black text-white uppercase italic tracking-tighter leading-none my-4">
                                {{ map.name }}
                            </h2>
                            <div class="flex items-center gap-6 mt-8">
                                <button [routerLink]="['/maps']"
                                    class="px-8 py-3 bg-indigo-600 text-white font-bold uppercase tracking-widest hover:bg-white hover:text-black transition-all rounded-full text-sm">
                                    Explore Data
                                </button>
                                <div class="hidden md:block">
                                    <p
                                        class="text-white/40 font-mono text-[10px] uppercase tracking-widest leading-none">
                                        Coordinates</p>
                                    <p class="text-white font-mono text-xs tracking-widest mt-1">45.46° N // 9.19° E</p>
                                </div>
                            </div>
                        </div>
                    </ng-template>
                </p-carousel>
            </div>

            <div class="order-1 lg:order-2 text-right hidden lg:block">
                <div class="inline-block border-r-4 border-indigo-600 pr-6">
                    <h3 class="text-white text-3xl font-black uppercase tracking-tighter mb-2">Tactical<br>Environment
                    </h3>
                    <p class="text-gray-500 text-sm max-w-[250px] ml-auto font-medium">
                        Analizza i siti di spike e ottimizza i lineup per ogni mappa del protocollo Valorant.
                    </p>
                </div>
            </div>

        </div>
    </div>
</section>

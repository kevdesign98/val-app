<nav class="fixed w-full z-20 top-0 start-0">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">

    <!-- logo -->
    <a routerLink="/Home" class="flex items-center space-x-3 rtl:space-x-reverse">
      <img src="https://flowbite.com/docs/images/logo.svg" class="h-8" alt="Logo">
      <span class="self-center text-2xl font-semibold whitespace-nowrap text-white">ValApp</span>
    </a>
   </div>
</nav>

<div class="min-h-screen flex items-center justify-center bg-gray-900 text-white">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-lg w-full max-w-md">
         <h1 class="text-white text-4xl font-bold text-center mb-4">Coming soon!</h1>

        <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
            <!-- Riot ID -->
            <div>
                <label class="block mb-1 text-sm font-medium">Riot ID</label>
                <input formControlName="riotId" type="text" placeholder="Kev"
                    class="w-full p-3 rounded bg-gray-700 focus:outline-none focus:ring focus:ring-red-500">
            </div>

            <!-- Tagline -->
            <div>
                <label class="block mb-1 text-sm font-medium">Tagline</label>
                <input formControlName="tagline" type="text" placeholder="EUW"
                    class="w-full p-3 rounded bg-gray-700 focus:outline-none focus:ring focus:ring-red-500">
            </div>

            <!-- Error -->
            <p *ngIf="errorMessage" class="text-red-400 text-sm">{{ errorMessage }}</p>

            <!-- Button -->
            <button type="submit" [disabled]="loading"
                class="w-full py-3 bg-red-600 hover:bg-red-700 rounded-lg font-bold">
                {{ loading ? 'Loading...' : 'Login' }}
            </button>
        </form>
    </div>
</div>

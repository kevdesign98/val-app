@if (isMobileMenuOpen) {
  <div
    class="md:hidden fixed inset-0 bg-[#08090B]/95 backdrop-blur-md z-[2000] flex flex-col p-6 animate-in fade-in slide-in-from-top-4 duration-300">
    <div class="flex justify-between items-center mb-12">
      <span class="text-indigo-500 font-black text-2xl italic tracking-tighter">V</span>
      <button (click)="isMobileMenuOpen = false" class="text-white p-2">
        <i class="fas fa-times text-2xl"></i>
      </button>
    </div>
    <nav class="flex flex-col gap-8">
      <div (click)="isMobileMenuOpen = false"
        class="flex items-center gap-4 text-indigo-500 bg-indigo-500/10 p-4 rounded-2xl border border-indigo-500/20">
        <i class="fas fa-th-large text-xl"></i>
        <span class="font-black italic uppercase tracking-widest text-sm">Dashboard</span>
      </div>
      <div (click)="isMobileMenuOpen = false"
        class="flex items-center gap-4 text-gray-400 p-4 hover:text-white transition-colors">
        <i class="fas fa-history text-xl"></i>
        <span class="font-black italic uppercase tracking-widest text-sm"><a
        [routerLink]="['/dashboard/matches', name, tag]">Matches</a></span>
      </div>
      <div (click)="isMobileMenuOpen = false"
        class="flex items-center gap-4 text-gray-400 p-4 hover:text-white transition-colors">
        <i class="fas fa-crosshairs text-xl"></i>
        <span class="font-black italic uppercase tracking-widest text-sm"><a>Weapons</a></span>
      </div>
      <div (click)="isMobileMenuOpen = false"
        class="flex items-center gap-4 text-gray-400 p-4 hover:text-white transition-colors">
        <i class="fas fa-shield-alt text-xl"></i>
        <span class="font-black italic uppercase tracking-widest text-sm">Agents</span>
      </div>
    </nav>
    <div class="mt-auto border-t border-white/5 pt-6 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white uppercase italic">
          {{ name.charAt(0) }}
        </div>
        <div class="flex flex-col">
          <span class="font-black italic text-sm text-white uppercase leading-none">{{ name }}</span>
          <span class="text-indigo-400 text-[10px] font-bold">#{{ tag }}</span>
        </div>
      </div>
      <button (click)="logout()" class="text-red-500 p-2 hover:bg-red-500/10 rounded-lg transition-colors">
        <i class="fas fa-sign-out-alt text-xl"></i>
      </button>
    </div>
  </div>
}

<aside
  class="hidden md:flex w-20 h-screen bg-[#0c0d10] border-r border-white/5 flex-col items-center py-6 fixed left-0 top-0 z-[1000]">
  <div class="mb-10 cursor-pointer" routerLink="/Home">
    <span class="text-indigo-500 font-black text-2xl tracking-tighter italic">V</span>
  </div>
  <nav class="flex flex-col gap-6 w-full px-2">
    <div routerLink="/dashboard"
      class="group relative flex justify-center py-3 text-indigo-500 bg-indigo-500/10 rounded-xl cursor-pointer">
      <i class="fas fa-th-large text-xl"></i>
      <span
      class="absolute left-20 bg-[#161920] text-[10px] px-2 py-1 rounded border border-white/10 opacity-0 group-hover:opacity-100 transition-opacity  whitespace-nowrap uppercase font-bold tracking-widest z-50">Dashboard</span>
    </div>
    <div [routerLink]="['/dashboard/matches', name, tag]"
      class="group relative flex justify-center py-3 text-indigo-500 bg-indigo-500/10 rounded-xl cursor-pointer">
      <i class="fas fa-history text-xl"></i>
      <span
        class="absolute left-20 bg-[#161920] text-[10px] px-2 py-1 rounded border border-white/10 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap uppercase font-bold tracking-widest z-50">
      Matches</span>
    </div>
    <div class="group relative flex justify-center py-3 text-indigo-500 bg-indigo-500/10 rounded-xl cursor-pointer">
      <i class="fas fa-crosshairs text-xl"></i>
      <span
      class="absolute left-20 bg-[#161920] text-[10px] px-2 py-1 rounded border border-white/10 opacity-0 group-hover:opacity-100 transition-opacity  whitespace-nowrap uppercase font-bold tracking-widest z-50">Weapons</span>
    </div>
    <div class="group relative flex justify-center py-3 text-indigo-500 bg-indigo-500/10 rounded-xl cursor-pointer">
      <i class="fas fa-shield-alt text-xl"></i>
      <span
      class="absolute left-20 bg-[#161920] text-[10px] px-2 py-1 rounded border border-white/10 opacity-0 group-hover:opacity-100 transition-opacity  whitespace-nowrap uppercase font-bold tracking-widest z-50">Agents</span>
    </div>
  </nav>
  <div class="mt-auto pb-4">
    <i class="fas fa-cog text-gray-600 hover:text-white cursor-pointer transition-colors text-xl"></i>
  </div>
</aside>

<header
  class="md:hidden fixed top-0 left-0 right-0 h-16 bg-[#0c0d10] border-b border-white/5 flex items-center justify-between px-6 z-[1001]">
  <span routerLink="/Home" class="text-indigo-500 font-black text-2xl italic tracking-tighter">V</span>
  <button (click)="isMobileMenuOpen = !isMobileMenuOpen" class="text-gray-400 hover:text-white transition-colors p-2">
    <i class="fas" [ngClass]="isMobileMenuOpen ? 'fa-times text-2xl' : 'fa-bars text-xl'"></i>
  </button>
</header>

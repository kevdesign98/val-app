<app-navbar />

<div class="relative h-[60vh] flex items-center justify-center overflow-hidden bg-[#050505]">
  <div class="absolute inset-0 z-0 hero-bg-mask">
    <img src="assets/map-bg.jpg" alt="Maps Background"
      class="w-full h-full object-cover opacity-50 animate-ken-burns" />
  </div>

  <div class="relative z-10 text-center px-6">
    <span class="text-indigo-500 font-mono tracking-[0.5em] text-[10px] uppercase block mb-4">// Sector:
      Battlefield_Overview</span>
    <h1 class="text-6xl md:text-8xl font-black text-white uppercase italic tracking-tighter leading-none mb-4">
      Master the <span class="text-indigo-600">Maps</span>
    </h1>
    <p class="text-lg text-gray-400 max-w-xl mx-auto font-medium italic opacity-80">
      Prepare for every battlefield. From the depths of Abyss to the heights of Ascent.
    </p>
  </div>
</div>

<section class="relative bg-[#050505] py-24 px-6 overflow-hidden">
  <div class="mesh-gradient-bg opacity-20"></div>
  <div class="map-overlay-tech"></div>

  <div class="container mx-auto relative z-10">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-12">

      <div *ngFor="let map of maps"
        class="group relative h-[300px] rounded-[2.5rem] overflow-hidden border border-white/10 transition-all duration-500 hover:border-indigo-500/50 hover:-translate-y-2 shadow-2xl">

        <img [src]="map.splash" [alt]="map.displayName" loading="lazy"
          class="absolute inset-0 w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110" />

        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>

        <div class="absolute inset-0 p-10 flex flex-col justify-end">
          <div class="flex justify-between items-end">
            <div>
              <span class="text-indigo-500 font-mono text-[10px] tracking-widest uppercase mb-1 block">Coordinate:
                {{map.coordinates || 'Unknown'}}</span>
              <h2
                class="text-5xl font-black text-white uppercase italic tracking-tighter leading-none group-hover:text-indigo-400 transition-colors">
                {{ map.displayName }}
              </h2>
            </div>

            <button [routerLink]="['/maps-strat', map.uuid]"
              class="p-4 bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl hover:bg-indigo-600 hover:border-indigo-500 transition-all group/btn">
              <span class="text-white group-hover:translate-x-1 inline-block transition-transform">→</span>
            </button>
          </div>
        </div>

        <div class="absolute top-6 left-6">
          <div class="px-3 py-1 bg-black/50 backdrop-blur-md border border-white/10 rounded-lg">
            <span class="text-[8px] font-bold text-white/60 tracking-[0.3em] uppercase italic">Tactical_Scan //
              OK</span>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>


<app-footer />

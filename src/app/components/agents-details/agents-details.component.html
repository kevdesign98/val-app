<app-navbar />

<!-- HERO SECTION -->
<div
  *ngIf="agent"
  class="section-hero relative bg-cover text-white px-4 min-h-screen md:px-8 py-8 overflow-hidden"
  [ngStyle]="{ 'background-image': 'url(' + agentBg + ')' }"
  style="background-position: center;"
>
  <!-- FRECCE SLIDER -->
  <button
    class="absolute left-4 top-1/2 -translate-y-1/2 bg-black bg-opacity-40 hover:bg-opacity-60 text-white text-3xl p-3 rounded-full transition z-50"
    (click)="goToPrevAgent()"
  >
    ←
  </button>

  <button
    class="absolute right-4 top-1/2 -translate-y-1/2 bg-black bg-opacity-40 hover:bg-opacity-60 text-white text-3xl p-3 rounded-full transition z-50"
    (click)="goToNextAgent()"
  >
    →
  </button>

  <!-- CONTENUTO PRINCIPALE -->
  <div class="container mx-auto flex flex-col md:flex-row gap-8 items-start">
    <!-- INFO AGENTE -->
    <div class="w-full md:w-3/12" style="padding-top: 6rem;">
      <h1 class="text-5xl font-bold">{{ agent.displayName }}</h1>
      <h2 class="text-xl text-gray-400 mb-6">{{ agent.role?.displayName }}</h2>
      <p class="text-sm leading-relaxed text-gray-300">
        {{ agent.description }}
      </p>
    </div>

    <!-- PORTRAIT -->
    <div class="w-full md:w-6/12 flex justify-center items-center">
      <img
        [src]="agent.fullPortrait"
        [alt]="agent.name?.displayName"
        class="max-w-[400px] w-full object-contain drop-shadow-[0_10px_25px_rgba(255,70,85,0.4)]"
      />
    </div>

    <!-- ABILITÀ -->
    <div class="w-full md:w-3/12 space-y-4">
      <h3 class="text-cyan-400 tracking-wide text-2xl">Abilities</h3>

      <div class="flex flex-wrap gap-2">
        <div
          *ngFor="let ability of agent.abilities; let i = index"
          (click)="selectAbility(i)"
          [class.border-purple-500]="i === selectedAbilityIndex"
          class="cursor-pointer p-2 border rounded-md transition hover:border-purple-400"
        >
          <img
            [src]="ability.displayIcon"
            [alt]="ability.displayName"
            class="w-8 h-8"
          />
        </div>
      </div>

      <video
        *ngIf="agent?.abilities[selectedAbilityIndex]?.videoUrl"
        [src]="agent.abilities[selectedAbilityIndex].videoUrl"
        autoplay
        muted = "true"
        loop
        class="w-full mt-4 rounded-md"
      ></video>

      <div class="mt-2 pb-20">
        <h4 class="text-white font-semibold text-lg">
          {{ agent.abilities[selectedAbilityIndex]?.displayName }}
        </h4>
        <p class="text-gray-400 text-sm">
          {{ agent.abilities[selectedAbilityIndex]?.description || 'No description.' }}
        </p>
      </div>
    </div>
  </div>
</div>

<app-footer />
